<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boodschappen">
<meta name="theme-color" content="#E9EEF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1622" media="(prefers-color-scheme: dark)">
<title>Boodschappenlijst</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B7%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF4; --surface:#FFFFFF; --ink:#12233B; --muted:#5A687B; --rule:#D3DBE5; --field:#F3F6F9;
  --tag:#FFD43B; --tag-ink:#12233B; --up:#B3303D; --focus:#2563EB; --primary:#12233B; --on-primary:#FFFFFF;
  --backdrop:rgba(18,35,59,.45); --toast-bg:#12233B; --toast-ink:#FFFFFF; --down:#1E7A4C;
  --font:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1622; --surface:#16212F; --ink:#E8EEF5; --muted:#98A6B9; --rule:#2A384A; --field:#1D2A3B;
    --tag:#FFD43B; --tag-ink:#12233B; --up:#F07884; --focus:#7AA7FF; --primary:#E8EEF5; --on-primary:#0E1622;
    --backdrop:rgba(0,0,0,.6); --toast-bg:#E8EEF5; --toast-ink:#0E1622; --down:#5CC98D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1622; --surface:#16212F; --ink:#E8EEF5; --muted:#98A6B9; --rule:#2A384A; --field:#1D2A3B;
  --tag:#FFD43B; --tag-ink:#12233B; --up:#F07884; --focus:#7AA7FF; --primary:#E8EEF5; --on-primary:#0E1622;
  --backdrop:rgba(0,0,0,.6); --toast-bg:#E8EEF5; --toast-ink:#0E1622; --down:#5CC98D;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:560px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 12px}
.titlebar{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--cond);font-weight:800;font-size:clamp(21px,5.8vw,31px);line-height:1.05;margin:2px 0 12px;min-width:0}
.linkbtn{background:none;border:0;padding:6px 0;font-weight:600;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;flex:none}
.addrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) auto;gap:8px}
.addbtn{width:48px;padding:0;font-size:26px;line-height:1}
.editgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px;margin:4px 0 12px}
.qtyrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 6px}
.qtyrow .lbl{margin:0}
.addrow input{width:100%;min-width:0;font:inherit;font-size:17px;padding:12px 12px;min-height:48px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
.addrow input::placeholder{color:var(--muted)}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.hassel main{padding-bottom:calc(250px + env(safe-area-inset-bottom,0px))}
.block{background:var(--surface);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px}
.block + .block{margin-top:12px}
.meta{color:var(--muted);font-size:14px;line-height:1.35}

.sumlead{font-size:15px;color:var(--muted);margin:0}
.win{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 6px}
.winname{font-family:var(--cond);font-weight:800;font-size:34px;line-height:1.05;overflow-wrap:anywhere}
.ranks{margin-top:12px;border-top:1px solid var(--rule)}
.rank{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule)}
.rank:last-child{border-bottom:0}
.rname{font-weight:600}
.rright{text-align:right;white-space:nowrap}
.rtotal{font-family:var(--cond);font-weight:700;font-size:21px}
.diff{color:var(--up);font-size:14px;font-weight:600;margin-left:8px}
.split{margin:12px 0 0;font-size:15px}
.more{margin-top:6px}

.tag{position:relative;display:inline-flex;flex:none;background:var(--tag);color:var(--tag-ink);border-radius:5px;padding:4px 10px 3px 21px}
.tag::before{content:"";position:absolute;left:7px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--surface);box-shadow:inset 0 1px 1.5px rgba(0,0,0,.28)}
.price{display:inline-flex;align-items:flex-start;font-family:var(--cond);font-weight:700;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.price .cur{font-size:.42em;margin:.2em .14em 0 0}
.price .c{font-size:.56em;margin:.06em 0 0 .05em;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.price-xl{font-size:40px}
.price-md{font-size:26px}
.price-sm{font-size:22px}

.items{background:var(--surface);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:12px}
.item{display:flex;align-items:center;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.tick{flex:none;display:flex;align-items:center;justify-content:center;width:52px;align-self:stretch;cursor:pointer;position:relative}
.tick input{position:absolute;opacity:0;width:44px;height:44px;margin:0;cursor:pointer}
.tick span{width:24px;height:24px;border:2px solid var(--muted);border-radius:50%;display:block}
.tick input:checked + span{background:var(--primary);border-color:var(--primary);box-shadow:inset 0 0 0 4px var(--surface)}
.tick input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.item-main{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 16px 13px 0;background:none;border:0;text-align:left;cursor:pointer}
.itext{display:flex;flex-direction:column;min-width:0}
.iname{font-weight:600;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.item.done .iname{text-decoration:line-through;color:var(--muted)}
.item.done .price{color:var(--muted)}
.clear{display:block;margin:10px 16px 0}

.empty h2{font-family:var(--cond);font-weight:700;font-size:25px;margin:0 0 6px}
.empty p{margin:0 0 14px;color:var(--muted);max-width:44ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;padding:8px 13px;border:1px solid var(--rule);border-radius:999px;background:var(--field);font-size:15px;line-height:1.2;cursor:pointer}
.chipcheck{position:relative;cursor:pointer}
.chipcheck input{position:absolute;opacity:0;pointer-events:none}
.chipcheck span{display:inline-block;padding:8px 13px;border:1px solid var(--rule);border-radius:999px;background:var(--field);font-size:15px;line-height:1.2}
.chipcheck input:checked + span{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chipcheck input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}

.status{color:var(--muted);font-size:14px;padding:14px 16px 0;margin:0}
.loading p{color:var(--muted);margin:12px 0 0}
.pulse{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;position:relative}
.pulse::after{content:"";position:absolute;inset:0 auto 0 0;width:35%;background:var(--tag);border-radius:3px;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.err{color:var(--up);font-weight:600;margin:0 0 12px}

.btn{min-height:48px;padding:12px 16px;border-radius:10px;border:1.5px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:600;font-size:16px;cursor:pointer}
.btn.secondary{background:transparent;color:var(--ink)}
.btn.text{background:none;border:0;color:var(--up);padding:12px 0;min-height:44px}

dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;border-radius:16px 16px 0 0;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.sheet::backdrop{background:var(--backdrop)}
dialog.sheet[open]{animation:sheetup .22s ease-out}
@keyframes sheetup{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.sheet-inner{max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 0 8px}
.sheet-head h2{font-family:var(--cond);font-weight:800;font-size:clamp(22px,6.4vw,28px);line-height:1.1;margin:0;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;min-width:0}
.close{flex:none;background:none;border:0;color:var(--muted);font-weight:600;font-size:15px;padding:6px 0 6px 8px;cursor:pointer}
.note{color:var(--muted);font-size:14px;margin:10px 0 4px;max-width:54ch}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0}

.editrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin:4px 0 6px}
.lbl{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.txt{width:100%;font:inherit;font-size:17px;padding:11px 12px;min-height:46px;border:1px solid var(--rule);border-radius:10px;background:var(--field);color:var(--ink);-webkit-appearance:none;appearance:none}
.qty{display:flex;align-items:center;border:1px solid var(--rule);border-radius:10px;background:var(--field);min-height:46px}
.qty button{width:44px;height:44px;background:none;border:0;font-size:22px;font-weight:600;cursor:pointer}
.qty output{min-width:28px;text-align:center;font-weight:600;font-size:17px}

.srow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;padding:13px 0;background:none;border:0;border-bottom:1px solid var(--rule);text-align:left;cursor:pointer}
.sname{font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pname{font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.right{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.badge{font-size:12px;font-weight:600;line-height:1;padding:3px 6px;border-radius:4px;border:1px solid currentColor;color:var(--muted)}
.badge.warn{color:var(--up)}
.extlink{display:inline-block;margin:6px 0 4px;font-size:15px;font-weight:600;text-underline-offset:3px}

.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:20;background:var(--toast-bg);color:var(--toast-ink);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:600px){
  main{padding-left:16px;padding-right:16px}
  .block,.items{border:1px solid var(--rule);border-radius:12px;overflow:hidden}
}
@media (prefers-reduced-motion: reduce){
  dialog.sheet[open]{animation:none}
  .pulse::after{animation:none;width:100%}
  .toast{transition:none}
}

body.hassel .toast{bottom:calc(230px + env(safe-area-inset-bottom,0px))}
.addrow.two{grid-template-columns:1fr auto}
.btn.wide{width:100%}
.actions .btn{flex:1}
.chg{display:block;font-size:14px;font-weight:600;line-height:1.35}
.chg.down{color:var(--down)}
.chg.upc{color:var(--up)}
.meta.warn{color:var(--up);font-weight:600}
.srow.static{cursor:default}
.srow[disabled]{cursor:default;opacity:.6}
.sheet-inner h3{font-family:var(--cond);font-weight:700;font-size:21px;margin:22px 0 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex}
.tabs button{flex:1;min-height:56px;background:none;border:0;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;position:relative;padding:0 4px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.selbar{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--surface);border-top:1px solid var(--rule);box-shadow:0 -6px 18px rgba(18,35,59,.12);padding:12px 16px}
.selbar .actions{margin-top:10px}
.sel1{margin:0 0 2px;font-weight:600}
.suggest{margin-top:8px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.sug{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--rule);text-align:left;font-size:16px;cursor:pointer}
.sug:last-child{border-bottom:0}
.pair{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.pgroup{margin-top:12px}
.pgroup h4{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;gap:12px}
.pline{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:3px 0;color:var(--ink)}
.pline span:last-child{white-space:nowrap}
.restore{margin-top:12px;padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--field)}
.restore p{margin:0}
.contents{margin:8px 0 0;font-size:15px}
.contents div{padding:3px 0}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="titlebar"><h1 id="viewTitle">Boodschappenlijst</h1><button class="linkbtn" id="settingsBtn">Instellingen</button></div>
    <div id="ctlList">
      <div class="addrow">
        <input id="newBrand" type="text" placeholder="Merk" list="brandList" autocomplete="off" autocapitalize="words" enterkeyhint="next" aria-label="Merk, optioneel">
        <input id="newItem" type="text" placeholder="Product" autocomplete="off" enterkeyhint="done" aria-label="Product">
        <button class="btn addbtn" id="addBtn" aria-label="Toevoegen aan lijst">+</button>
      </div>
      <div class="suggest" id="suggest" hidden></div>
    </div>
    <div id="ctlLabels" hidden>
      <div class="addrow two">
        <input id="labelSearch" type="search" placeholder="Zoek in mijn producten" autocomplete="off" aria-label="Zoek in mijn producten">
        <button class="btn" id="newLabelBtn">Nieuw</button>
      </div>
    </div>
    <div id="ctlSaved" hidden>
      <button class="btn wide" id="saveListBtn">Huidige lijst bewaren</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="viewList">
    <section id="summary" aria-live="polite"></section>
    <section id="items"></section>
    <p class="status" id="status"></p>
  </div>
  <div id="viewLabels" hidden></div>
  <div id="viewSaved" hidden></div>
</main>

<div class="selbar" id="selBar" hidden></div>
<nav class="tabs" aria-label="Onderdelen">
  <div class="wrap">
    <button data-view="list" aria-current="page">Lijst</button>
    <button data-view="labels">Producten</button>
    <button data-view="saved">Vaste lijsten</button>
  </div>
</nav>

<datalist id="brandList"></datalist>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle"><div class="sheet-inner" id="sheetInner"></div></dialog>
<dialog id="labelSheet" class="sheet" aria-labelledby="labelTitle"><div class="sheet-inner" id="labelInner"></div></dialog>
<dialog id="savedSheet" class="sheet" aria-labelledby="savedTitle"><div class="sheet-inner" id="savedInner"></div></dialog>
<dialog id="settingsSheet" class="sheet" aria-labelledby="settingsTitle"><div class="sheet-inner" id="settingsInner"></div></dialog>

<script>
(function(){
"use strict";

const DATA_URL="https://raw.githubusercontent.com/supermarkt/checkjebon/main/data/supermarkets.json";
const COMMITS_URL="https://api.github.com/repos/supermarkt/checkjebon/commits?path=data/supermarkets.json&per_page=1";
const CACHE_NAME="checkjebon-data";
const LS={list:"boodschappenlijst.v1",meta:"boodschappenlijst.meta.v1",labels:"boodschappenlijst.labels.v1",saved:"boodschappenlijst.saved.v1",prices:"boodschappenlijst.prices.v1"};
const MAX_AGE=6*3600*1000, CHANGE_MS=14*864e5, PRUNE_MS=120*864e5;
const STORE_NAMES={ah:"Albert Heijn",aldi:"Aldi",coop:"Coop",dekamarkt:"DekaMarkt",dirk:"Dirk",ekoplaza:"Ekoplaza",hoogvliet:"Hoogvliet",janlinders:"Jan Linders",jumbo:"Jumbo",lidl:"Lidl",picnic:"Picnic",plus:"Plus",poiesz:"Poiesz",spar:"Spar",vomar:"Vomar"};
const EXAMPLES=[["","halfvolle melk 1 l"],["Calvé","pindakaas"],["","bananen"],["","scharreleieren 10 stuks"]];
const DEFAULT_STORES=["ah","jumbo","lidl","plus"];
const MAX_STORES=4;
const UNIT_WORDS=new Set(["kg","kilo","kilogram","g","gr","gram","grams","ml","milliliter","milliliters","mililiter","cl","centiliter","l","liter","liters","ltr","st","stk","stuk","stuks","x"]);

const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eurFmt=new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"});
const fmt=n=>eurFmt.format(n);
const numFmt=new Intl.NumberFormat("nl-NL",{maximumFractionDigits:2});
function norm(s){
  let t=String(s||"").toLowerCase();
  if(/[^\x00-\x7f]/.test(t)) t=t.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return t.replace(/[^a-z0-9]+/g," ").trim();
}
function readJSON(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function writeJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const clean1=s=>String(s||"").trim().replace(/\s+/g," ");
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* ---------- state ---------- */
function cleanItem(i){
  if(!i||typeof i!=="object") return null;
  const base={id:typeof i.id==="string"&&i.id?i.id:rid(),qty:Math.max(1,Math.min(99,parseInt(i.qty,10)||1)),done:!!i.done};
  if(typeof i.lab==="string"&&i.lab) return Object.assign(base,{lab:i.lab,q:typeof i.q==="string"?i.q:""});
  if(typeof i.q!=="string"||!i.q.trim()) return null;
  const pins={}; if(i.pins&&typeof i.pins==="object") for(const k in i.pins) if(typeof i.pins[k]==="string") pins[k]=i.pins[k];
  return Object.assign(base,{b:typeof i.b==="string"?i.b:"",q:i.q,pins});
}
function cleanLabel(l){
  if(!l||typeof l.name!=="string"||!l.name.trim()) return null;
  const picks={}; if(l.picks&&typeof l.picks==="object") for(const k in l.picks) if(typeof l.picks[k]==="string"&&l.picks[k]) picks[k]=l.picks[k];
  return {id:typeof l.id==="string"&&l.id?l.id:rid(),name:clean1(l.name),picks};
}
function cleanSaved(s){
  if(!s||typeof s.name!=="string"||!Array.isArray(s.items)) return null;
  return {id:typeof s.id==="string"&&s.id?s.id:rid(),name:clean1(s.name)||"Lijst",items:s.items.map(cleanItem).filter(Boolean),at:Number(s.at)||Date.now()};
}
let data=null, status="loading", loadedBytes=0, refreshing=false;
let meta=readJSON(LS.meta)||{};
let list=readJSON(LS.list)||{};

/* ---------- sizes and prices ---------- */
const SIZE_RE=/(\d+(?:[.,]\d+)?)\s*(kilogram|kilo|kg|grams?|gr|g|milliliters?|mililiters?|ml|centiliters?|cl|liters?|ltr|l|stuks?|stk|st)(?![a-z])/;
function parseSize(s){
  if(!s) return null;
  let t=String(s).toLowerCase(), mult=1;
  const mm=t.match(/(\d+)\s*x\s*(?=\d)/);
  if(mm){ mult=parseInt(mm[1],10)||1; t=t.slice(0,mm.index)+" "+t.slice(mm.index+mm[0].length); }
  const m=t.match(SIZE_RE); if(!m) return null;
  let v=parseFloat(m[1].replace(",",".")); const u=m[2]; let b,f;
  if(/^(kilogram|kilo|kg)$/.test(u)){b="kg";f=1;}
  else if(/^(grams?|gr|g)$/.test(u)){b="kg";f=.001;}
  else if(/^(milliliters?|mililiters?|ml)$/.test(u)){b="l";f=.001;}
  else if(/^(centiliters?|cl)$/.test(u)){b="l";f=.01;}
  else if(/^(liters?|ltr|l)$/.test(u)){b="l";f=1;}
  else {b="st";f=1;}
  v=v*f*mult;
  return v>0&&v<1000?{v,b}:null;
}
function szOf(pr){ if(pr.sz===undefined) pr.sz=parseSize(pr.s)||parseSize(pr.n); return pr.sz; }
function fmtSize(sz){
  if(!sz) return "";
  if(sz.b==="kg") return sz.v<1?Math.round(sz.v*1000)+" gram":numFmt.format(sz.v)+" kilo";
  if(sz.b==="l") return sz.v<1?Math.round(sz.v*1000)+" ml":numFmt.format(sz.v)+" liter";
  return numFmt.format(sz.v)+(sz.v===1?" stuk":" stuks");
}
const perLabel=b=>b==="kg"?"per kilo":b==="l"?"per liter":"per stuk";
function sizeBits(pr){ const sz=szOf(pr), bits=[]; if(sz){ bits.push(fmtSize(sz)); bits.push(fmt(pr.p/sz.v)+" "+perLabel(sz.b)); } return bits.join(", "); }

}
const pk=pr=>pr.l||(pr.n+"|"+pr.s);

function change(sid,pr){

  if(e&&e.at&&Date.now()-e.at<CHANGE_MS&&typeof e.prev==="number"&&Math.abs(e.prev-pr.p)>=0.005) return {prev:e.prev,down:pr.p<e.prev};
  return null;
}
function chgHTML(sid,pr,storeName){
  const c=change(sid,pr); if(!c) return "";
  return '<span class="chg '+(c.down?"down":"upc")+'">'+(c.down?"Gedaald":"Gestegen")+(storeName?" bij "+esc(storeName):"")+', was '+esc(fmt(c.prev))+'</span>';
}
function trackKeys(){
  const keys=new Map();
  for(const L of labels) for(const sid in L.picks){ const st=storeById(sid); const pr=st&&st.byKey.get(L.picks[sid]); if(pr) keys.set(sid+"|"+pk(pr),pr); }
  for(const st of activeStores()) for(const it of list.items){ const c=chosenFor(it,st); if(c) keys.set(st.id+"|"+pk(c.pr),c.pr); }
  return keys;
}
function trackPrices(){
  if(!data) return {down:0,up:0};
  const now=Date.now(); let down=0, up=0;
  for(const [k,pr] of trackKeys()){
    const e=pm[k];
    if(!e) pm[k]={p:pr.p,s:now};
    else if(Math.abs(e.p-pr.p)>=0.005){ if(pr.p<e.p) down++; else up++; pm[k]={p:pr.p,prev:e.p,at:now,s:now}; }
    else e.s=now;
  }
  for(const k in pm) if(!pm[k]||now-(pm[k].s||0)>PRUNE_MS) delete pm[k];
  savePM();
  return {down,up};
}
let trackT;
function scheduleTrack(){ clearTimeout(trackT); trackT=setTimeout(trackPrices,800); }

/* ---------- matching ---------- */
function parseQuery(q){
  const size=parseSize(q);
  let tokens=norm(q).split(" ").filter(Boolean);
  if(size) tokens=tokens.filter(t=>!/^\d/.test(t)&&!UNIT_WORDS.has(t));
  return {tokens,size};
}
function relevance(k,tokens,phrase){
  let rel=1;
  for(const t of tokens){
    let i=k.indexOf(t); if(i<0) return -1;
    let good=false;
    while(i>-1){
      const end=i+t.length;
      if(end===k.length||k.charCodeAt(end)===32){ good=true; break; }
      i=k.indexOf(t,i+1);
    }
    if(!good) rel=2;
  }
  if(rel===1&&(k+" ").indexOf(phrase+" ")>-1) rel=0;
  return rel;
}
function extraWords(k,n){
  let c=0; for(const w of k.split(" ")) if(w&&!/^\d/.test(w)&&!UNIT_WORDS.has(w)) c++;
  return Math.max(0,c-n);
}
function classify(c,m){
  const sz=c.sz;
  if(!sz) return 2;
  if(!m.base||sz.b!==m.base) return 3;
  const r=sz.v/m.med;
  if(m.size){ if(r>=0.9&&r<=1.15) return 0; if(r>=0.9&&r<=2) return 1; return 3; }
  if(Math.abs(r-1)<=0.15) return 0;
  if(r>=0.5&&r<=2) return 1;
  return 3;
}
function rankCmp(a,b){
  if(a.pu!==b.pu) return a.pu-b.pu;
  const ga=a.cls<=1?0:a.cls-1, gb=b.cls<=1?0:b.cls-1;
  if(ga!==gb) return ga-gb;
  if(a.rel!==b.rel) return a.rel-b.rel;
  if(a.cls!==b.cls) return a.cls-b.cls;
  if(a.cls===1&&a.up!=null&&b.up!=null&&a.up!==b.up) return a.up-b.up;
  if(a.cls===3&&a.dist!==b.dist) return a.dist-b.dist;
  return a.pr.p-b.pr.p;
}
function makeCand(pr,m,rel,pu){
  const sz=szOf(pr);
  const c={pr,sz,up:sz?pr.p/sz.v:null,rel:rel==null?1:rel,pu:pu||0};
  c.cls=classify(c,m);
  c.dist=sz&&m.base&&sz.b===m.base?Math.abs(Math.log(sz.v/m.med)):99;
  return c;
}
function matchItem(q){
  const key=norm(q);
  if(matchCache.has(key)) return matchCache.get(key);
  const pq=parseQuery(q);
  const m={tokens:pq.tokens,size:pq.size,base:null,med:null,perStore:new Map()};
  if(data&&pq.tokens.length){
    const raw=new Map(), phrase=pq.tokens.join(" "); let anyGood=false;
    for(const st of data){
      const found=[];
      for(const pr of st.products){ const r=relevance(pr.k,pq.tokens,phrase); if(r>-1){ found.push({pr,rel:r,pu:extraWords(pr.k,pq.tokens.length)>3?1:0}); if(r<2) anyGood=true; } }
      raw.set(st.id,found);
    }
    let counts={}, sizes={}; const pc={}, ps={}; let pureSized=0;
    for(const [id,found] of raw){
      const keep=anyGood?found.filter(f=>f.rel<2):found;
      raw.set(id,keep);
      for(const f of keep){ const sz=szOf(f.pr); if(sz){ counts[sz.b]=(counts[sz.b]||0)+1; (sizes[sz.b]=sizes[sz.b]||[]).push(sz.v); if(!f.pu){ pureSized++; pc[sz.b]=(pc[sz.b]||0)+1; (ps[sz.b]=ps[sz.b]||[]).push(sz.v); } } }
    }
    if(pureSized>=3){ counts=pc; sizes=ps; }
    if(pq.size){ m.base=pq.size.b; m.med=pq.size.v; }
    else{
      let best=null; for(const b in counts) if(!best||counts[b]>counts[best]) best=b;
      if(best){ const arr=sizes[best].sort((a,b)=>a-b); m.base=best; m.med=arr[Math.floor(arr.length/2)]; }
    }
    for(const [id,found] of raw){ const cands=found.map(f=>makeCand(f.pr,m,f.rel,f.pu)); cands.sort(rankCmp); m.perStore.set(id,cands); }
  }
  matchCache.set(key,m);
  return m;
}
function labCand(pr){ const sz=szOf(pr); return {pr,sz,up:sz?pr.p/sz.v:null,cls:0,pu:0,rel:0,pinned:true,lab:true}; }
function chosenFor(it,st){
  if(it.lab){
    const L=labelById(it.lab), key=L&&L.picks[st.id]; if(!key) return null;
    const pr=st.byKey.get(key); return pr?labCand(pr):null;
  }
  const m=matchItem(fullQ(it)), cands=m.perStore.get(st.id)||[], pin=it.pins&&it.pins[st.id];
  if(pin){
    let c=cands.find(x=>pk(x.pr)===pin);
    if(!c){ const pr=st.byKey.get(pin); if(pr) c=makeCand(pr,m); }
    if(c) return Object.assign({},c,{pinned:true});
  }
  return cands[0]||null;
}
const storeById=id=>data&&data.find(s=>s.id===id)||null;
function activeStores(){
  if(!data) return [];
  let a=data.filter(s=>list.on.indexOf(s.id)>-1);
  if(!a.length){ a=data.slice(0,MAX_STORES); list.on=a.map(s=>s.id); saveList(); }
  return a;
}
function computeFor(items){
  const stores=activeStores();
  const rows=items.map(it=>{
    const per=new Map();
    for(const st of stores){ const c=chosenFor(it,st); if(c) per.set(st.id,c); }
    const all=[...per.entries()], good=all.filter(e=>(e[1].cls<=2&&!e[1].pu)||e[1].pinned), pool=good.length?good:all;
    let best=null,bestId=null;
    for(const [id,c] of pool) if(!best||c.pr.p<best.pr.p){ best=c; bestId=id; }
    return {it,per,best,bestId};
  });
  const totals=stores.map(st=>{ let total=0,found=0; for(const r of rows){ const c=r.per.get(st.id); if(c){ total+=c.pr.p*r.it.qty; found++; } } return {st,total,found}; })
    .filter(t=>t.found>0).sort((a,b)=>b.found-a.found||a.total-b.total);
  return {rows,totals,n:rows.length,stores};
}
function bestPair(C){
  const S=C.stores; if(S.length<2||!C.rows.length) return null;
  let best=null;
  for(let i=0;i<S.length;i++) for(let j=i+1;j<S.length;j++){
    const a=S[i].id, b=S[j].id; let total=0,found=0,na=0,nb=0,ta=0,tb=0; const assign=[];
    for(const r of C.rows){
      const ca=r.per.get(a), cb=r.per.get(b); let sid=null,c=null;
      if(ca&&cb){ if(cb.pr.p<ca.pr.p-1e-9){ sid=b; c=cb; } else { sid=a; c=ca; } }
      else if(ca){ sid=a; c=ca; } else if(cb){ sid=b; c=cb; }
      if(c){ const v=c.pr.p*r.it.qty; total+=v; found++; if(sid===a){ na++; ta+=v; } else { nb++; tb+=v; } }
      assign.push({r,sid,c});
    }
    const cand={a,b,total,found,na,nb,ta,tb,assign};
    if(!best||found>best.found||(found===best.found&&total<best.total-1e-9)) best=cand;
  }
  if(best&&best.nb>best.na){ [best.a,best.b]=[best.b,best.a]; [best.na,best.nb]=[best.nb,best.na]; [best.ta,best.tb]=[best.tb,best.ta]; }
  return best;
}

function fmtWhen(ts){
  const d=new Date(ts), t=new Date();
  const time=d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  if(d.toDateString()===t.toDateString()) return "vandaag om "+time;
  const y=new Date(t); y.setDate(t.getDate()-1);
  if(d.toDateString()===y.toDateString()) return "gisteren om "+time;
  return d.toLocaleDateString("nl-NL",{day:"numeric",month:"long"})+" om "+time;
}

function renderSelBar(){

/* ---------- view switching ---------- */
function setView(v){
  view=v;
  document.querySelectorAll(".tabs [data-view]").forEach(b=>{ if(b.dataset.view===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("#viewTitle").textContent=v==="list"?"Boodschappenlijst":v==="labels"?"Mijn producten":"Vaste lijsten";
  $("#ctlList").hidden=v!=="list"; $("#ctlLabels").hidden=v!=="labels"; $("#ctlSaved").hidden=v!=="saved";
  $("#viewList").hidden=v!=="list"; $("#viewLabels").hidden=v!=="labels"; $("#viewSaved").hidden=v!=="saved";
  window.scrollTo(0,0);
  render();
}
document.querySelectorAll(".tabs [data-view]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));

function render(){
  if(view==="list"){ const C=status==="ready"?computeFor(list.items):null; renderSummary(C); renderItems(C); renderStatus(); }
  else if(view==="labels") renderLabelsView();
  else renderSavedView();
  renderSelBar(); renderBrands(); renderSuggest();
  if(els.sheet.open) renderSheet();
  if(els.savedSheet.open) renderSavedSheet();
  if(els.settings.open) renderSettings();
  scheduleTrack();
}

function productRowsHTML(cands,curKey,attr){
  return cands.map(c=>{
    const bits=sizeBits(c.pr), isCur=pk(c.pr)===curKey;
    const meta=[bits,isCur?"gekozen":""].filter(Boolean).join(", ");
    return '<button class="srow" '+attr+'="'+esc(pk(c.pr))+'" aria-pressed="'+isCur+'"><span><span class="pname" style="font-weight:'+(isCur?600:400)+'">'+esc(c.pr.n)+'</span>'+(meta?'<span class="meta" style="display:block">'+esc(meta)+'</span>':'')+'</span><span class="right">'+priceHTML(c.pr.p,"price-sm")+'</span></button>';
  }).join("");

function searchStore(st,term,limit){
  const toks=norm(term).split(" ").filter(Boolean); if(!toks.length) return {res:[],total:0};
  const phrase=toks.join(" "), res=[];
  for(const p of st.products){ if(toks.every(t=>p.k.indexOf(t)>-1)) res.push({pr:p,rel:relevance(p.k,toks,phrase)}); }
  res.sort((a,b)=>a.rel-b.rel||a.pr.p-b.pr.p);
  return {res:res.slice(0,limit),total:res.length};
}
function renderPickList(){

  if(norm(pickFilter)) cands=searchStore(st,pickFilter,60).res.map(x=>makeCand(x.pr,m));
  else cands=(m.perStore.get(st.id)||[]).slice(0,60);
  if(!cands.length){ box.innerHTML='<p class="note">'+(norm(pickFilter)?"Geen producten gevonden. Probeer een ander zoekwoord.":"Hier is niets automatisch gevonden. Zoek hierboven op merk of productnaam.")+'</p>'; return; }
  box.innerHTML=productRowsHTML(cands,curKey,"data-choose");
}
els.sheetInner.addEventListener("click",e=>{
  if(!sheetView) return;

  if(t.closest("#removeItem")){ list.items=list.items.filter(i=>i.id!==it.id); saveList(); closeDialog(els.sheet); render(); toast("“"+itemName(it)+"” verwijderd"); return; }

});
els.sheetInner.addEventListener("input",e=>{ if(e.target.id==="pickFilter"){ pickFilter=e.target.value; renderPickList(); } });
els.sheetInner.addEventListener("change",e=>{ if(e.target.id==="itemName"||e.target.id==="itemBrand") commitName(); });
els.sheetInner.addEventListener("keydown",e=>{

function commitName(){
  const inp=$("#itemName"), bi=$("#itemBrand"); if(!inp||!sheetView) return;

/* ---------- label editor ---------- */
function openLabelEditor(id,init){
  const L=id?labelById(id):null;

function renderLabelSheet(){
  if(!draft) return;
  if(draft.view==="search"){ renderLabelSearch(); return; }
  const rows=activeStores().map(st=>{ const key=draft.picks[st.id]; return {st,key,pr:key?st.byKey.get(key):null}; });

      right=(priced.length>1&&r.pr.p===min)?'<span class="tag">'+priceHTML(r.pr.p,"price-md")+'</span>':priceHTML(r.pr.p,"price-md");
    } else if(r.key) left='<span class="meta warn" style="display:block">Niet meer gevonden. Tik om een vervanger te kiezen.</span>';
    else left='<span class="meta" style="display:block">Nog niet gekozen. Tik om te zoeken.</span>';

function renderLabelSearch(){
  const st=storeById(draft.store); if(!st){ draft.view="edit"; renderLabelSheet(); return; }

    +'<p class="note">Zoek het artikel bij '+esc(st.name)+'. Gebruik de naam zoals deze winkel hem noemt, bijvoorbeeld een Engelse of Nederlandse omschrijving.</p>'
    +'<input id="lSearch" class="txt" type="search" value="'+esc(term)+'" placeholder="Zoek bij '+esc(st.name)+'" autocomplete="off" aria-label="Zoek bij '+esc(st.name)+'">'

function renderLabelResults(){
  const box=$("#lResults"); if(!box||!draft) return;
  const st=storeById(draft.store); if(!st) return;
  const term=($("#lSearch")||{}).value||"";
  if(!norm(term)){ box.innerHTML='<p class="note">Typ een merk of productnaam.</p>'; return; }

  if(!r.total){ box.innerHTML='<p class="note">Niets gevonden bij '+esc(st.name)+'. Probeer minder of andere woorden.</p>'; return; }
  box.innerHTML=(r.total>80?'<p class="note">'+r.total+' resultaten. De eerste 80 staan hieronder, typ meer woorden om te verfijnen.</p>':'')
    +productRowsHTML(r.res.map(x=>labCand(x.pr)),draft.picks[st.id]||null,"data-lpick");

els.labelInner.addEventListener("input",e=>{

els.labelInner.addEventListener("keydown",e=>{ if(e.target.id==="lSearch"&&e.key==="Enter"){ e.preventDefault(); e.target.blur(); } });
function saveDraft(){
  const n=$("#lName"); if(n) draft.name=n.value;
  const name=clean1(draft.name), err=$("#lErr");
  if(!name){ err.textContent="Geef het product een naam."; if(n) n.focus(); return; }
  if(!Object.keys(draft.picks).length){ err.textContent="Kies bij minstens één winkel een artikel."; return; }
  let L=draft.id?labelById(draft.id):null;
  if(L){ L.name=name; L.picks=Object.assign({},draft.picks); }
  else{ L={id:rid(),name,picks:Object.assign({},draft.picks)}; labels.push(L); }
  sortLabels();
  if(draft.fromItem){ const it=findItem(draft.fromItem); if(it){ list.items[list.items.indexOf(it)]={id:it.id,lab:L.id,q:L.name,qty:it.qty,done:it.done}; } }
  for(const it of list.items) if(it.lab===L.id) it.q=L.name;
  const wasNew=!draft.id;
  saveLabels(); saveList();
  draft=null; closeDialog(els.labelSheet);
  render(); trackPrices();
  toast(wasNew?"Opgeslagen bij Mijn producten":"Product aangepast");
}
function deleteLabel(id){
  const L=labelById(id); if(!L) return;
  labels=labels.filter(x=>x.id!==id);
  const conv=it=>it.lab===id?{id:it.id,b:"",q:L.name,qty:it.qty,done:it.done,pins:{}}:it;
  list.items=list.items.map(conv); for(const s of saved) s.items=s.items.map(conv);
  selected.delete(id);
  saveLabels(); saveList(); saveSaved();
  closeDialog(els.labelSheet); render();
  toast("“"+L.name+"” verwijderd");
}

/* ---------- labels view events ---------- */
$("#newLabelBtn").addEventListener("click",()=>openLabelEditor(null,{name:clean1($("#labelSearch").value)}));
$("#labelSearch").addEventListener("input",e=>{ labelFilter=e.target.value; renderLabelsView(); });
$("#viewLabels").addEventListener("click",e=>{
  if(e.target.closest("#emptyNewLabel")){ openLabelEditor(null); return; }
  const b=e.target.closest("[data-lab]"); if(b) openLabelEditor(b.dataset.lab);
});
$("#viewLabels").addEventListener("change",e=>{
  const id=e.target.dataset.sel; if(!id) return;
  if(e.target.checked) selected.add(id); else selected.delete(id);
  renderSelBar();
});
$("#selBar").addEventListener("click",e=>{
  if(e.target.closest("#selClear")){ selected.clear(); render(); return; }
  if(e.target.closest("#selAdd")){
    let added=0, had=0;
    for(const id of selected){ const L=labelById(id); if(!L) continue; const ex=list.items.find(i=>i.lab===id); if(ex){ ex.done=false; had++; } else { list.items.unshift({id:rid(),lab:id,q:L.name,qty:1,done:false}); added++; } }
    selected.clear(); saveList(); render();
    if(!added) toast(had===1?"Dit product stond al op je lijst":"Deze producten stonden al op je lijst");
    else toast((added===1?"1 product":added+" producten")+" op je lijst gezet"+(had?", "+had+" stond"+(had===1?"":"en")+" er al op":""));
  }
});

/* ---------- saved lists ---------- */
const cloneItems=items=>items.map(i=>cleanItem(Object.assign(JSON.parse(JSON.stringify(i)),{id:rid(),done:false}))).filter(Boolean);
const itemKey=i=>i.lab?"L:"+i.lab:"F:"+norm(fullQ(i));
function openSaved(v){ savedView=v; renderSavedSheet(); showDialog(els.savedSheet); if(v.mode==="new") setTimeout(()=>{ const n=$("#sName"); if(n) n.focus(); },60); }
function renderSavedSheet(){
  if(!savedView) return;
  let html;
  if(savedView.mode==="new"){
    const n=list.items.length;
    html='<div class="sheet-head"><h2 id="savedTitle">Lijst bewaren</h2><button class="close" data-close>Sluiten</button></div>'
      +'<div class="field"><label class="lbl" for="sName">Naam</label><input id="sName" class="txt" placeholder="Bijvoorbeeld weekboodschappen" autocomplete="off" autocapitalize="sentences"></div>'
      +'<p class="note">Je bewaart de '+(n===1?"1 product":n+" producten")+' die nu op je lijst staan, met de aantallen en je eigen keuzes per winkel.</p>'
      +'<p class="err" id="sErr" role="alert"></p><div class="actions"><button class="btn" id="sSave">Bewaren</button><button class="btn secondary" data-close>Annuleren</button></div>';
  } else {
    const s=saved.find(x=>x.id===savedView.id); if(!s){ closeDialog(els.savedSheet); return; }
    const sum=savedSummary(s);
    html='<div class="sheet-head"><h2 id="savedTitle">'+esc(s.name)+'</h2><button class="close" data-close>Sluiten</button></div>'
      +(sum?'<p class="note">'+esc(sum)+'</p>':'')
      +'<div class="contents">'+s.items.map(i=>'<div>'+esc((i.qty>1?i.qty+"× ":"")+itemName(i))+'</div>').join("")+'</div>'
      +'<div class="actions"><button class="btn" id="sReplace">Vervang mijn lijst</button><button class="btn secondary" id="sAdd">Toevoegen</button></div>'
      +(list.items.length?'<div style="margin-top:6px"><button class="linkbtn" id="sUpdate">Bijwerken met mijn huidige lijst</button></div>':'')
      +'<button class="btn text" id="sDel">Lijst verwijderen</button>';
  }
  els.savedInner.innerHTML=html;
}
$("#saveListBtn").addEventListener("click",()=>{ if(list.items.length) openSaved({mode:"new"}); });
$("#viewSaved").addEventListener("click",e=>{ const b=e.target.closest("[data-saved]"); if(b) openSaved({mode:"open",id:b.dataset.saved}); });
els.savedInner.addEventListener("keydown",e=>{ if(e.target.id==="sName"&&e.key==="Enter"){ e.preventDefault(); $("#sSave").click(); } });
els.savedInner.addEventListener("click",e=>{
  if(!savedView) return;
  const t=e.target;
  if(t.closest("#sSave")){
    const name=clean1($("#sName").value);
    if(!name){ $("#sErr").textContent="Geef de lijst een naam."; return; }
    saved.unshift({id:rid(),name,items:cloneItems(list.items),at:Date.now()}); saveSaved();
    closeDialog(els.savedSheet); render(); toast("“"+name+"” bewaard"); return;
  }
  const s=saved.find(x=>x.id===savedView.id); if(!s) return;
  const rep=t.closest("#sReplace");
  if(rep){
    const go=()=>{ list.items=cloneItems(s.items); saveList(); closeDialog(els.savedSheet); setView("list"); toast("“"+s.name+"” staat nu op je lijst"); };
    if(list.items.length) arm(rep,"Vervang mijn lijst","Tik nogmaals om te vervangen",go); else go();
    return;
  }
  if(t.closest("#sAdd")){
    for(const i of cloneItems(s.items)){ const ex=list.items.find(x=>itemKey(x)===itemKey(i)); if(ex){ ex.qty=Math.min(99,ex.qty+i.qty); ex.done=false; } else list.items.push(i); }
    saveList(); closeDialog(els.savedSheet); setView("list"); toast("“"+s.name+"” toegevoegd aan je lijst"); return;
  }
  const up=t.closest("#sUpdate");
  if(up){ arm(up,"Bijwerken met mijn huidige lijst","Tik nogmaals om bij te werken",()=>{ s.items=cloneItems(list.items); s.at=Date.now(); saveSaved(); render(); toast("“"+s.name+"” bijgewerkt"); }); return; }
  const del=t.closest("#sDel");
  if(del) arm(del,"Lijst verwijderen",null,()=>{ saved=saved.filter(x=>x.id!==s.id); saveSaved(); closeDialog(els.savedSheet); render(); toast("“"+s.name+"” verwijderd"); });
});

/* ---------- settings ---------- */
function renderSettings(){
  let html='<div class="sheet-head"><h2 id="settingsTitle">Instellingen</h2><button class="close" data-close>Sluiten</button></div>'
    +'<h3>Winkels</h3><p class="note">Kies maximaal vier supermarkten om te vergelijken.</p><div class="chips" id="storeChips">';
  html+=data?data.map(s=>'<label class="chipcheck"><input type="checkbox" value="'+esc(s.id)+'"'+(list.on.indexOf(s.id)>-1?" checked":"")+'><span>'+esc(s.name)+'</span></label>').join(""):'<p class="meta">De winkels verschijnen zodra de prijzen geladen zijn.</p>';
  html+='</div>';
  if(data&&data.some(s=>s.id==="lidl")&&list.on.indexOf("lidl")>-1) html+='<p class="note">De prijzen van Lidl komen via boodschaapje.nl en zijn minder volledig dan die van de andere winkels.</p>';
  html+='<h3>Prijzen</h3><p class="note">'+(refreshing?"Prijzen worden vernieuwd…":meta.fetchedAt?"Opgehaald "+fmtWhen(meta.fetchedAt)+(meta.updatedAt?", door Checkjebon bijgewerkt "+fmtWhen(meta.updatedAt):"")+". De app haalt ze automatisch opnieuw op als ze ouder zijn dan zes uur. Gedaalde en gestegen prijzen van je producten zie je twee weken lang.":"")+'</p>'
    +'<button class="btn secondary" id="refreshBtn"'+(refreshing?" disabled":"")+'>Prijzen nu vernieuwen</button>'
    +'<h3>Back-up</h3><p class="note">Bewaar je vaste producten, vaste lijsten en boodschappenlijst in een bestand. Zo raak je niets kwijt als je je browsergegevens wist of een nieuwe telefoon neemt.</p>'
    +'<div class="actions" style="margin-top:8px"><button class="btn secondary" id="backupBtn">Back-up maken</button><button class="btn secondary" id="restoreBtn">Terugzetten</button></div><div id="restoreBox"></div>';
  els.settingsInner.innerHTML=html;
  renderRestoreBox();
}
function renderRestoreBox(){
  const box=$("#restoreBox"); if(!box) return;
  if(!pendingRestore){ box.innerHTML=""; return; }
  if(pendingRestore.error){ box.innerHTML='<div class="restore"><p class="err" style="margin:0">'+esc(pendingRestore.error)+'</p></div>'; return; }
  const r=pendingRestore, when=r.exported&&Date.parse(r.exported)?" van "+fmtWhen(Date.parse(r.exported)):"";
  box.innerHTML='<div class="restore"><p>Back-up'+esc(when)+' met '+r.labels.length+' vaste producten, '+r.saved.length+' vaste lijsten en '+r.items.length+' producten op je lijst. Je huidige gegevens worden hierdoor vervangen.</p><div class="actions"><button class="btn" id="doRestore">Terugzetten</button><button class="btn secondary" id="cancelRestore">Annuleren</button></div></div>';
}
$("#settingsBtn").addEventListener("click",()=>{ pendingRestore=null; renderSettings(); showDialog(els.settings); });
els.settingsInner.addEventListener("change",e=>{
  if(!e.target.closest("#storeChips")) return;
  const id=e.target.value; if(!id) return;
  if(e.target.checked){
    if(list.on.length>=MAX_STORES){ e.target.checked=false; toast("Je kunt maximaal vier winkels kiezen. Zet er eerst een uit."); return; }
    if(list.on.indexOf(id)<0) list.on.push(id);
  } else {
    if(list.on.length<=1){ e.target.checked=true; toast("Kies minstens één winkel"); return; }
    list.on=list.on.filter(x=>x!==id);
  }
  saveList(); render();
});
els.settingsInner.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#refreshBtn")){ fetchFresh(!data,true); return; }
  if(t.closest("#backupBtn")){ exportBackup(); return; }
  if(t.closest("#restoreBtn")){ const f=$("#restoreFile"); f.value=""; f.click(); return; }
  if(t.closest("#cancelRestore")){ pendingRestore=null; renderRestoreBox(); return; }
  if(t.closest("#doRestore")&&pendingRestore&&!pendingRestore.error){
    const r=pendingRestore;
    labels=r.labels; sortLabels(); saved=r.saved; list.items=r.items; if(r.on) list.on=r.on;
    saveLabels(); saveSaved(); saveList(); selected.clear(); pendingRestore=null;
    closeDialog(els.settings); render(); trackPrices(); toast("Back-up teruggezet");
  }
});
async function exportBackup(){
  const obj={app:"boodschappenlijst",version:1,exported:new Date().toISOString(),labels,saved,items:list.items,on:list.on};
  const text=JSON.stringify(obj), name="boodschappen-backup-"+today()+".json";
  try{
    if(typeof File==="function"&&navigator.canShare){
      const file=new File([text],name,{type:"application/json"});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Back-up boodschappenlijst"}); toast("Back-up gemaakt"); return; }
    }
  }catch(err){ if(err&&err.name==="AbortError") return; }
  try{
    const url=URL.createObjectURL(new Blob([text],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast("Back-up gedownload");
  }catch(err){ toast("De back-up kon niet worden gemaakt."); }
}
$("#restoreFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  try{
    const o=JSON.parse(await f.text());
    if(!o||o.app!=="boodschappenlijst") throw new Error("x");
    pendingRestore={labels:(Array.isArray(o.labels)?o.labels:[]).map(cleanLabel).filter(Boolean),saved:(Array.isArray(o.saved)?o.saved:[]).map(cleanSaved).filter(Boolean),items:(Array.isArray(o.items)?o.items:[]).map(cleanItem).filter(Boolean),on:Array.isArray(o.on)&&o.on.length?o.on.slice(0,MAX_STORES):null,exported:o.exported};
  }catch(err){ pendingRestore={error:"Dit bestand is geen back-up van deze app."}; }
  renderRestoreBox();
});

/* ---------- list events ---------- */
function addItem(b,q){
  b=clean1(b); q=clean1(q); if(!q) return false;
  if(!b){ const L=labels.find(x=>norm(x.name)===norm(q)); if(L) return addLabelItem(L.id); }
  const key="F:"+norm((b?b+" ":"")+q);
  const ex=list.items.find(i=>itemKey(i)===key);
  if(ex){ ex.qty=Math.min(99,ex.qty+1); ex.done=false; toast("Aantal verhoogd naar "+ex.qty); }
  else list.items.unshift({id:rid(),b,q,qty:1,done:false,pins:{}});
  saveList(); render(); return true;
}
function addLabelItem(id){
  const L=labelById(id); if(!L) return false;
  const ex=list.items.find(i=>i.lab===id);
  if(ex){ ex.qty=Math.min(99,ex.qty+1); ex.done=false; toast("Aantal verhoogd naar "+ex.qty); }
  else list.items.unshift({id:rid(),lab:id,q:L.name,qty:1,done:false});
  saveList(); render(); return true;
}
function clearInputs(){ els.newBrand.value=""; els.newItem.value=""; renderSuggest(); }
function addFromInputs(){
  if(!clean1(els.newItem.value)){ toast(clean1(els.newBrand.value)?"Vul ook het product in":"Vul een product in"); els.newItem.focus(); return; }
  addItem(els.newBrand.value,els.newItem.value); clearInputs(); els.newBrand.focus();
}
let sugHide;
function renderSuggest(){
  const box=$("#suggest");
  const q=norm(clean1(els.newBrand.value)+" "+clean1(els.newItem.value));
  if(view!=="list"||q.length<2||!labels.length||document.activeElement!==els.newItem&&document.activeElement!==els.newBrand){ box.hidden=true; box.innerHTML=""; return; }
  const toks=q.split(" ");
  const hits=labels.filter(L=>{ const k=norm(L.name); return toks.every(t=>k.indexOf(t)>-1); }).slice(0,5);
  if(!hits.length){ box.hidden=true; box.innerHTML=""; return; }
  box.innerHTML=hits.map(L=>'<button class="sug" data-sug="'+esc(L.id)+'"><span>'+esc(L.name)+'</span><span class="badge">Mijn product</span></button>').join("");
  box.hidden=false;
}
$("#addBtn").addEventListener("click",addFromInputs);
for(const inp of [els.newBrand,els.newItem]){
  inp.addEventListener("input",renderSuggest);
  inp.addEventListener("focus",()=>{ clearTimeout(sugHide); renderSuggest(); });
  inp.addEventListener("blur",()=>{ sugHide=setTimeout(renderSuggest,200); });
}
$("#suggest").addEventListener("mousedown",e=>e.preventDefault());
$("#suggest").addEventListener("click",e=>{ const b=e.target.closest("[data-sug]"); if(!b) return; addLabelItem(b.dataset.sug); clearInputs(); els.newItem.focus(); });
els.newBrand.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); els.newItem.focus(); } });
els.newItem.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addFromInputs(); } });
$("#summary").addEventListener("click",e=>{
  const ex=e.target.closest("[data-eq]"); if(ex){ addItem(ex.dataset.eb,ex.dataset.eq); return; }
  if(e.target.closest("#moreBtn")){ showAll=!showAll; render(); return; }
  if(e.target.closest("#pairBtn")){ showPair=!showPair; render(); return; }
  if(e.target.closest("#retryBtn")) fetchFresh(true,false);
});
$("#items").addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o){ openItem(o.dataset.open); return; }
  if(e.target.closest("#clearDone")){ const n=list.items.filter(i=>i.done).length; list.items=list.items.filter(i=>!i.done); saveList(); render(); toast(n===1?"1 product verwijderd":n+" producten verwijderd"); }
});
$("#items").addEventListener("change",e=>{
  const id=e.target.dataset.done; if(!id) return;
  const it=findItem(id); if(it){ it.done=e.target.checked; saveList(); render(); }
});

/* ---------- loading data ---------- */
function ingest(json){
  if(!Array.isArray(json)) throw new Error("Onverwacht formaat");
  const stores=[];
  for(const s of json){
    if(!s||!Array.isArray(s.d)||!s.d.length) continue;
    const id=String(s.n||"").toLowerCase(); if(!id) continue;
    const products=[];
    for(const x of s.d){ const p=Number(x&&x.p); if(!x||!x.n||!(p>0)) continue; products.push({n:String(x.n),k:norm(x.n),p,s:x.s?String(x.s):"",l:x.l?String(x.l):""}); }
    if(products.length){ const byKey=new Map(); for(const p of products) byKey.set(pk(p),p); stores.push({id,name:STORE_NAMES[id]||String(s.c||id).replace(/\s*\(.*\)$/,""),url:typeof s.u==="string"?s.u:"",products,byKey}); }
  }
  if(!stores.length) throw new Error("Geen winkels");
  stores.sort((a,b)=>a.name.localeCompare(b.name,"nl"));
  data=stores; status="ready"; matchCache.clear();
}
async function readWithProgress(res){
  if(!res.body||!res.body.getReader) return res.text();
  const reader=res.body.getReader(), chunks=[]; let last=0;
  for(;;){
    const {done,value}=await reader.read(); if(done) break;
    chunks.push(value); loadedBytes+=value.length;
    if(loadedBytes-last>300000){ last=loadedBytes; updateLoadText(); }
  }
  const all=new Uint8Array(loadedBytes); let off=0; for(const c of chunks){ all.set(c,off); off+=c.length; }
  return new TextDecoder("utf-8").decode(all);
}
async function fetchUpdatedAt(){
  try{
    const r=await fetch(COMMITS_URL,{headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok) return;
    const j=await r.json(), d=j&&j[0]&&j[0].commit&&(j[0].commit.committer||j[0].commit.author), ts=d&&Date.parse(d.date);
    if(ts){ meta.updatedAt=ts; saveMeta(); if(view==="list") renderStatus(); if(els.settings.open) renderSettings(); }
  }catch(e){}
}
async function fetchFresh(foreground,manual){
  if(refreshing) return;
  refreshing=true; loadedBytes=0;
  if(foreground){ status="loading"; render(); }
  if(els.settings.open) renderSettings();
  try{
    const res=await fetch(DATA_URL,{cache:"no-cache"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const text=await readWithProgress(res);
    ingest(JSON.parse(text));
    meta.fetchedAt=Date.now(); saveMeta();
    if("caches" in window){ try{ const c=await caches.open(CACHE_NAME); await c.put(DATA_URL,new Response(text,{headers:{"content-type":"application/json"}})); }catch(e){} }
    refreshing=false;
    const ch=trackPrices();
    render();
    fetchUpdatedAt();
    if(ch.down||ch.up){
      const parts=[]; if(ch.down) parts.push(ch.down===1?"1 prijs gedaald":ch.down+" prijzen gedaald"); if(ch.up) parts.push(ch.up===1?"1 prijs gestegen":ch.up+" prijzen gestegen");
      toast("Sinds de vorige keer: "+parts.join(" en ")+".");
    } else if(!foreground||manual) toast("Prijzen bijgewerkt");
  }catch(e){
    refreshing=false;
    if(!data){ status="error"; render(); }
    else{ status="ready"; render(); if(manual) toast("Vernieuwen is niet gelukt. Je ziet de laatst opgehaalde prijzen."); }
  }
}
async function loadData(){
  render();
  let ok=false;
  if("caches" in window){
    try{
      const c=await caches.open(CACHE_NAME), r=await c.match(DATA_URL);
      if(r){ ingest(JSON.parse(await r.text())); ok=true; trackPrices(); render(); }
    }catch(e){ ok=false; }
  }
  if(!ok) await fetchFresh(true,false);
  else if(Date.now()-(meta.fetchedAt||0)>MAX_AGE) fetchFresh(false,false);
}
loadData();
})();
